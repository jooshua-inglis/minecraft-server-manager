name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so `git describe` can find tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The web dashboard is prebuilt and committed (internal/webui/dist),
      # so no JS toolchain is needed. Pure Go, so cross-compiling to arm64
      # from an amd64 runner needs no emulation.
      - name: Build linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="$(git describe --tags --always --dirty)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/jooshua-inglis/minecraft-server-manager/internal/cliapp.version=${version}" \
            -o "dist/mcm-linux-${{ matrix.goarch }}" ./cmd/mcm

      - uses: actions/upload-artifact@v7
        with:
          name: mcm-linux-${{ matrix.goarch }}
          path: dist/mcm-linux-${{ matrix.goarch }}
          if-no-files-found: error

  # Somewhere to download the binaries from any device, no GitHub login:
  #   - every push to main refreshes a rolling "latest" prerelease
  #   - pushing a v* tag creates a normal versioned release
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mcm-linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum mcm-linux-* > SHA256SUMS

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Refresh rolling "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Rolling build of \`main\` at ${GITHUB_SHA}. Tag a \`v*\` release for a stable version."
